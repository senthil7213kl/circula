spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/circula}
    username: ${DB_USERNAME:circula}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
  h2:
    console:
      enabled: false
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
