services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: circula
      POSTGRES_USER: circula
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circula}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circula -d circula"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/circula
      DB_USERNAME: circula
      DB_PASSWORD: ${POSTGRES_PASSWORD:-circula}
      DB_DRIVER: org.postgresql.Driver
      DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
