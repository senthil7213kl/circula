apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: circula-db
spec:
  serviceName: circula-db
  replicas: 1
  selector:
    matchLabels:
      app: circula-db
  template:
    metadata:
      labels:
        app: circula-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: circula
            - name: POSTGRES_USER
              value: circula
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: circula-db-secret
                  key: password
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U circula -d circula"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U circula -d circula"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: circula-db-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circula-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circula-api
  template:
    metadata:
      labels:
        app: circula-api
    spec:
      containers:
        - name: api
          image: circula:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: circula-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: circula-db-secret
                  key: password
          startupProbe:
            httpGet:
              path: /api/books
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/books
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/books
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: circula-api
spec:
  type: ClusterIP
  selector:
    app: circula-api
  ports:
    - name: http
      port: 8080
      targetPort: http
